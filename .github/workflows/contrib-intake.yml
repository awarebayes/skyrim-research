name: Contributor intake checks
# Pull requests that change reconstruction sources: the contributor-scope rules of
# tools/contrib.py (only unit files, size cap, source lint). Runs on GitHub-hosted runners with a
# read-only token and no secrets; it holds no game data and compiles nothing. Advisory only: a
# pull_request workflow runs as the pull request defines it, so a pull request that edits this file
# can change it. The Engineer's local intake re-run (docs/contributor-intake.md) is authoritative.
# Byte comparison happens later on the project's own verifiers.
on:
  pull_request:
    paths:
      - 'reconstruction/**'
permissions:
  contents: read
jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # The checks run from the base branch's copy of the tools and read the pull request's files
      # through git as data, so the pull request's own copy of the tools is not what runs here.
      - run: git worktree add "$RUNNER_TEMP/base" "${{ github.event.pull_request.base.sha }}"
      - run: >-
          python3 "$RUNNER_TEMP/base/tools/contrib.py" intake
          --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"
